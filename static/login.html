<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Political Speech Generator</title>
  <style>
    :root {
      --bg: #0f1c2e;
      --panel: #1a2d45;
      --ink: #e8eef6;
      --muted: #9bb0c9;
      --accent: #c9a227;
      --danger: #e07070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #243b5a 0%, transparent 55%),
        linear-gradient(160deg, var(--bg), #152238 60%, #0c1624);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid #2f4a6a;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    p { margin: 0 0 1.4rem; color: var(--muted); font-size: 0.95rem; }
    label { display: block; margin: 0.85rem 0 0.35rem; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid #3a5678;
      background: #102033;
      color: var(--ink);
      font-size: 1rem;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.8rem;
      border: 0;
      background: var(--accent);
      color: #1a1405;
      font-weight: 700;
      cursor: pointer;
    }
    .msg { margin-top: 1rem; min-height: 1.2rem; font-size: 0.9rem; }
    .msg.error { color: var(--danger); }
    .msg.ok { color: #7dcea0; }
    .hint { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p>Log in to generate and save speeches.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Log in</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="hint">After login you’ll be redirected to the speech form. Token is kept in memory for this tab.</p>
  </div>
  <script>
    // Shared with formHandler.js via window / localStorage for cross-page access.
    let authToken = null;

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.className = "msg";
      msg.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.className = "msg error";
          msg.textContent = data.message || "Login failed";
          return;
        }
        authToken = data.access_token;
        window.authToken = authToken;
        // Persist for other pages in this browser (formHandler reads this).
        localStorage.setItem("authToken", authToken);
        msg.className = "msg ok";
        msg.textContent = "Logged in. Redirecting…";
        setTimeout(() => { window.location.href = "/"; }, 600);
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Could not reach server.";
      }
    });
  </script>
</body>
</html>
